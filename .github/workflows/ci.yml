name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: swift build
        run: swift build -c release

      - name: Smoke test
        run: |
          BIN=.build/release/macgroom
          "$BIN" --version
          "$BIN" --help
          "$BIN" scan --path "$RUNNER_TEMP" --json
